# Original fixed-origin memory layout, ca65/ld65.
MEMORY {
    ZP: start = $0002, size = $00FE, file = "";
    SAVE: start = $0400, size = $0100, file = "";
    DOUBLE: start = $0560, size = $0278, file = "";
    GAME: start = $1800, size = $2400, file = %O;
}
SEGMENTS {
    AT_0002: load = ZP, type = zp;
    AT_0400: load = SAVE, type = bss;
    AT_0560: load = DOUBLE, type = bss;
    AT_1800: load = GAME, type = ro;
}

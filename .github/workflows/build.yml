name: Reassemble Tycoon Tex

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install cc65 and PlatformIO
        run: |
          sudo apt-get update
          sudo apt-get install -y cc65
          python -m pip install platformio==6.1.19
      - name: Build from preserved sources
        run: python scripts/restore_c16.py
      - name: Test syntax, provenance, and object records
        run: python -m unittest discover -s test -p 'test_*.py' -v
      - name: Build both PlatformIO environments
        run: pio run -e c16 -e c16_debug
      - name: Check output agreement
        run: |
          cmp build/tycoon-tex.prg build/platformio/c16/tycoon-tex.prg
          cmp build/tycoon-tex.prg build/platformio/c16_debug/tycoon-tex.prg
      - uses: actions/upload-artifact@v4
        with:
          name: tycoon-tex-c16
          path: |
            build/tycoon-tex.prg
            build/comparison.json
            build/recovery-manifest.json
            build/tycoon.s
            build/tycoon.labels
            build/tycoon.map
            build/tycoon.dbg
